version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ChromaDB doesn't have an official slim docker image we want to run, but we can run it in memory or file mode locally in python for the prototype, or spin up chromadb docker.
  # Using official chroma container:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
